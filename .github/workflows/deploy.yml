name: Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Download data.json
        run: wget https://data.agilestory.blog/data.json

      - name: Install dependencies
        run: nix develop -c yarn install --immutable

      - name: Check and test
        run: nix develop -c sh -c "yarn typecheck && yarn test"

      - name: Build web
        run: nix develop -c yarn web build

      - run: cp CNAME apps/agilestory.blog/dist/CNAME

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/agilestory.blog/dist
